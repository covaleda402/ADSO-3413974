<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" />
    </marker>
    <marker id="arrow-extend" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7600" />
    </marker>
  </defs>

  <!-- FRONTERA DEL SISTEMA -->
  <rect x="220" y="30" width="700" height="720" rx="12" ry="12" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="6,4" />
  <text x="570" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#212529">Sistema Nuvora — Centro Comercial San Pedro Plaza</text>

  <!-- ==================== ACTORES ==================== -->
  
  <!-- ACTOR: VISITANTE -->
  <g transform="translate(60, 160)">
    <circle cx="25" cy="18" r="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#6c8ebf" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#6c8ebf" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#6c8ebf" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#6c8ebf" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3557">Visitante /</text>
    <text x="25" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3557">Consumidor</text>
  </g>

  <!-- ACTOR: LOCATARIO -->
  <g transform="translate(1010, 150)">
    <circle cx="25" cy="18" r="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#82b366" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#82b366" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#82b366" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#82b366" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#274e13">Locatario</text>
    <text x="25" y="130" text-anchor="middle" font-size="11" fill="#444444">(Comercio)</text>
  </g>

  <!-- ACTOR: CAJERO -->
  <g transform="translate(1010, 500)">
    <circle cx="25" cy="18" r="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#d79b00" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#d79b00" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#d79b00" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#d79b00" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45f06">Cajero /</text>
    <text x="25" y="130" text-anchor="middle" font-size="11" fill="#b45f06">Validador</text>
  </g>

  <!-- ACTOR SECUNDARIO: SERVIDOR / BD -->
  <g transform="translate(60, 520)">
    <rect x="0" y="10" width="70" height="45" rx="5" ry="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
    <line x1="0" y1="25" x2="70" y2="25" stroke="#9673a6" stroke-width="1.5"/>
    <text x="35" y="0" text-anchor="middle" font-size="10" fill="#6a1b9a">&lt;&lt;System&gt;&gt;</text>
    <text x="35" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">BD / API</text>
    <text x="35" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">PostgreSQL</text>
  </g>

  <!-- ==================== CASOS DE USO ==================== -->

  <!-- CU01: Consultar catálogo -->
  <g id="cu01_grp">
    <ellipse cx="360" cy="110" rx="95" ry="30" fill="#ffffff" stroke="#0066cc" stroke-width="1.8" />
    <text x="360" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">CU01: Consultar catálogo</text>
    <text x="360" y="120" text-anchor="middle" font-size="10" fill="#333333">de locales y menús</text>
  </g>

  <!-- CU02: Filtrar presupuesto -->
  <g id="cu02_grp">
    <ellipse cx="360" cy="195" rx="95" ry="30" fill="#ffffff" stroke="#0066cc" stroke-width="1.8" />
    <text x="360" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">CU02: Filtrar productos</text>
    <text x="360" y="205" text-anchor="middle" font-size="10" fill="#333333">por presupuesto ($COP)</text>
  </g>

  <!-- CU03: Generar cupón -->
  <g id="cu03_grp">
    <ellipse cx="360" cy="285" rx="95" ry="30" fill="#ffffff" stroke="#0066cc" stroke-width="1.8" />
    <text x="360" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">CU03: Generar cupón</text>
    <text x="360" y="295" text-anchor="middle" font-size="10" fill="#333333">digital de descuento</text>
  </g>

  <!-- CU04: Autenticar usuario -->
  <g id="cu04_grp">
    <ellipse cx="580" cy="330" rx="90" ry="28" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
    <text x="580" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">CU04: Autenticar usuario</text>
    <text x="580" y="340" text-anchor="middle" font-size="10" fill="#555555">en la plataforma (JWT)</text>
  </g>

  <!-- CU05: Gestionar promociones -->
  <g id="cu05_grp">
    <ellipse cx="790" cy="130" rx="95" ry="30" fill="#ffffff" stroke="#2b78e4" stroke-width="1.8" />
    <text x="790" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">CU05: Gestionar</text>
    <text x="790" y="140" text-anchor="middle" font-size="10" fill="#333333">promociones del local</text>
  </g>

  <!-- CU06: Parametrizar franjas horarias -->
  <g id="cu06_grp">
    <ellipse cx="790" cy="235" rx="95" ry="30" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
    <text x="790" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">CU06: Parametrizar</text>
    <text x="790" y="245" text-anchor="middle" font-size="10" fill="#555555">franjas relámpago</text>
  </g>

  <!-- CU10: Consultar analítica -->
  <g id="cu10_grp">
    <ellipse cx="580" cy="180" rx="90" ry="28" fill="#ffffff" stroke="#2b78e4" stroke-width="1.8" />
    <text x="580" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">CU10: Consultar métricas</text>
    <text x="580" y="190" text-anchor="middle" font-size="10" fill="#333333">de conversión y auditoría</text>
  </g>

  <!-- CU07: Canjear cupón en caja -->
  <g id="cu07_grp">
    <ellipse cx="780" cy="480" rx="95" ry="30" fill="#ffffff" stroke="#d79b00" stroke-width="2" />
    <text x="780" y="475" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45f06">CU07: Canjear cupón</text>
    <text x="780" y="490" text-anchor="middle" font-size="10" fill="#333333">en punto de venta</text>
  </g>

  <!-- CU08: Verificar QR criptográfico -->
  <g id="cu08_grp">
    <ellipse cx="460" cy="560" rx="95" ry="30" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="460" y="555" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">CU08: Verificar código</text>
    <text x="460" y="570" text-anchor="middle" font-size="10" fill="#333333">QR criptográfico (ACID)</text>
  </g>

  <!-- CU09: Digitar código manual -->
  <g id="cu09_grp">
    <ellipse cx="780" cy="610" rx="95" ry="30" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
    <text x="780" y="605" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">CU09: Digitar código</text>
    <text x="780" y="620" text-anchor="middle" font-size="10" fill="#555555">manual (contingencia)</text>
  </g>

  <!-- ==================== ASOCIACIONES SÓLIDAS ==================== -->
  <!-- Visitante -> CU01, CU02, CU03 -->
  <line x1="110" y1="180" x2="265" y2="115" stroke="#333333" stroke-width="1.5" />
  <line x1="110" y1="205" x2="265" y2="195" stroke="#333333" stroke-width="1.5" />
  <line x1="110" y1="230" x2="265" y2="280" stroke="#333333" stroke-width="1.5" />

  <!-- Locatario -> CU05, CU10 -->
  <line x1="1010" y1="180" x2="885" y2="135" stroke="#333333" stroke-width="1.5" />
  <line x1="1010" y1="200" x2="670" y2="185" stroke="#333333" stroke-width="1.5" />

  <!-- Cajero -> CU07 -->
  <line x1="1010" y1="530" x2="875" y2="485" stroke="#333333" stroke-width="1.5" />

  <!-- CU08 -> Servidor BD -->
  <line x1="365" y1="565" x2="130" y2="565" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="4,3" />

  <!-- ==================== RELACIONES INCLUDE (Discontinua Base -> Destino) ==================== -->
  
  <!-- CU03 -> CU04 <<include>> -->
  <path d="M 445 305 Q 480 320 500 325" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-include)" />
  <rect x="420" y="325" width="75" height="18" fill="#ffffff" stroke="#b85450" rx="3" ry="3"/>
  <text x="457" y="338" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">&lt;&lt;include&gt;&gt;</text>

  <!-- CU07 -> CU08 <<include>> -->
  <path d="M 695 505 Q 580 520 550 545" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-include)" />
  <rect x="580" y="505" width="75" height="18" fill="#ffffff" stroke="#b85450" rx="3" ry="3"/>
  <text x="617" y="518" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">&lt;&lt;include&gt;&gt;</text>

  <!-- ==================== RELACIONES EXTEND (Discontinua Extensión -> Base) ==================== -->
  
  <!-- CU06 -> CU05 <<extend>> -->
  <path d="M 790 205 L 790 165" fill="none" stroke="#2d7600" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-extend)" />
  <rect x="800" y="175" width="75" height="18" fill="#ffffff" stroke="#2d7600" rx="3" ry="3"/>
  <text x="837" y="188" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d7600">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU09 -> CU07 <<extend>> -->
  <path d="M 780 580 L 780 515" fill="none" stroke="#2d7600" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-extend)" />
  <rect x="790" y="535" width="75" height="18" fill="#ffffff" stroke="#2d7600" rx="3" ry="3"/>
  <text x="827" y="548" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d7600">&lt;&lt;extend&gt;&gt;</text>

</svg>
