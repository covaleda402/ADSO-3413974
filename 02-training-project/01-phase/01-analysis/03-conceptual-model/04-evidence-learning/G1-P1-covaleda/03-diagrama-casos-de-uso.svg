<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcador Flecha Include (Rojo) -->
    <marker id="arrow-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
    <!-- Marcador Flecha Extend (Verde) -->
    <marker id="arrow-extend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#82b366" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- ==================== FRONTERA DEL SISTEMA ==================== -->
  <rect x="210" y="30" width="750" height="730" rx="15" ry="15" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="8,6" />
  <text x="585" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529" letter-spacing="0.5">Sistema Nuvora — Centro Comercial San Pedro Plaza</text>

  <!-- ==================== ACTORES ==================== -->
  
  <!-- ACTOR: ADMINISTRADOR SAN PEDRO PLAZA (Arriba Izquierda) -->
  <g transform="translate(60, 45)">
    <circle cx="25" cy="18" r="14" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#9673a6" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#9673a6" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#9673a6" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#9673a6" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Administrador</text>
    <text x="25" y="130" text-anchor="middle" font-size="11" fill="#444444">(San Pedro Plaza)</text>
  </g>

  <!-- ACTOR: LOCATARIO / COMERCIO (Arriba Derecha) -->
  <g transform="translate(1010, 45)">
    <circle cx="25" cy="18" r="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#82b366" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#82b366" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#82b366" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#82b366" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#274e13">Locatario</text>
    <text x="25" y="130" text-anchor="middle" font-size="11" fill="#444444">(Comercio)</text>
  </g>

  <!-- ACTOR: VISITANTE / CONSUMIDOR (Medio Izquierda) -->
  <g transform="translate(60, 230)">
    <circle cx="25" cy="18" r="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#6c8ebf" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#6c8ebf" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#6c8ebf" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#6c8ebf" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3557">Visitante /</text>
    <text x="25" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3557">Consumidor</text>
  </g>

  <!-- ACTOR: CAJERO (Abajo Derecha) -->
  <g transform="translate(1010, 490)">
    <circle cx="25" cy="18" r="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
    <line x1="25" y1="32" x2="25" y2="65" stroke="#d79b00" stroke-width="2.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#d79b00" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="10" y2="95" stroke="#d79b00" stroke-width="2.5"/>
    <line x1="25" y1="65" x2="40" y2="95" stroke="#d79b00" stroke-width="2.5"/>
    <text x="25" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45f06">Cajero / Validador</text>
    <text x="25" y="130" text-anchor="middle" font-size="11" fill="#444444">(Punto de Venta)</text>
  </g>

  <!-- ==================== CASOS DE USO ==================== -->

  <!-- CU10: Consultar analítica y auditoría (Ubicación Draw.io: y=110) -->
  <g id="cu10_grp">
    <ellipse cx="580" cy="140" rx="100" ry="30" fill="#ffffff" stroke="#2b78e4" stroke-width="1.8" />
    <text x="580" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">CU10: Consultar métricas</text>
    <text x="580" y="150" text-anchor="middle" font-size="10" fill="#333333">de conversión y auditoría</text>
  </g>

  <!-- CU01: Consultar catálogo (y=150) -->
  <g id="cu01_grp">
    <ellipse cx="350" cy="180" rx="90" ry="30" fill="#ffffff" stroke="#0066cc" stroke-width="1.8" />
    <text x="350" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0066cc">CU01: Consultar catálogo</text>
    <text x="350" y="190" text-anchor="middle" font-size="10" fill="#333333">de locales y menús</text>
  </g>

  <!-- CU02: Filtrar productos por presupuesto (y=240) -->
  <g id="cu02_grp">
    <ellipse cx="350" cy="270" rx="90" ry="30" fill="#ffffff" stroke="#0066cc" stroke-width="1.8" />
    <text x="350" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#0066cc">CU02: Filtrar productos</text>
    <text x="350" y="280" text-anchor="middle" font-size="10" fill="#333333">por presupuesto ($COP)</text>
  </g>

  <!-- CU03: Generar cupón digital (y=330) -->
  <g id="cu03_grp">
    <ellipse cx="350" cy="360" rx="90" ry="30" fill="#ffffff" stroke="#0066cc" stroke-width="1.8" />
    <text x="350" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#0066cc">CU03: Generar cupón</text>
    <text x="350" y="370" text-anchor="middle" font-size="10" fill="#333333">digital de descuento</text>
  </g>

  <!-- CU04: Autenticar usuario (Included by CU03, y=360) -->
  <g id="cu04_grp">
    <ellipse cx="590" cy="390" rx="90" ry="30" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
    <text x="590" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">CU04: Autenticar usuario</text>
    <text x="590" y="400" text-anchor="middle" font-size="10" fill="#444444">en la plataforma (JWT)</text>
  </g>

  <!-- CU05: Gestionar promociones (y=160) -->
  <g id="cu05_grp">
    <ellipse cx="810" cy="190" rx="90" ry="30" fill="#ffffff" stroke="#2b78e4" stroke-width="1.8" />
    <text x="810" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">CU05: Gestionar</text>
    <text x="810" y="200" text-anchor="middle" font-size="10" fill="#333333">promociones del local</text>
  </g>

  <!-- CU06: Parametrizar franjas (Extends CU05, y=270) -->
  <g id="cu06_grp">
    <ellipse cx="810" cy="300" rx="90" ry="30" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
    <text x="810" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">CU06: Parametrizar</text>
    <text x="810" y="310" text-anchor="middle" font-size="10" fill="#444444">franjas relámpago</text>
  </g>

  <!-- CU07: Canjear cupón en caja (y=470) -->
  <g id="cu07_grp">
    <ellipse cx="810" cy="500" rx="90" ry="30" fill="#ffffff" stroke="#d79b00" stroke-width="1.8" />
    <text x="810" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45f06">CU07: Canjear cupón</text>
    <text x="810" y="510" text-anchor="middle" font-size="10" fill="#333333">en punto de venta</text>
  </g>

  <!-- CU08: Verificar código QR criptográfico (Included by CU07, y=550) -->
  <g id="cu08_grp">
    <ellipse cx="530" cy="580" rx="90" ry="30" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8" />
    <text x="530" y="576" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">CU08: Verificar código</text>
    <text x="530" y="590" text-anchor="middle" font-size="10" fill="#4a148c">QR criptográfico (ACID)</text>
  </g>

  <!-- CU09: Digitar código manual (Extends CU07, y=590) -->
  <g id="cu09_grp">
    <ellipse cx="810" cy="620" rx="90" ry="30" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
    <text x="810" y="616" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">CU09: Digitar código</text>
    <text x="810" y="630" text-anchor="middle" font-size="10" fill="#444444">manual (contingencia)</text>
  </g>

  <!-- ==================== ASOCIACIONES DE ACTORES (CERO CRUCES GARANTIZADO) ==================== -->
  
  <!-- Administrador -> CU10 -->
  <line x1="110" y1="90" x2="480" y2="140" stroke="#9673a6" stroke-width="1.8" />

  <!-- Locatario -> CU10 (Línea limpia directa hacia CU10) -->
  <line x1="1010" y1="90" x2="680" y2="140" stroke="#82b366" stroke-width="1.8" />

  <!-- Locatario -> CU05 (Línea directa hacia CU05) -->
  <line x1="1010" y1="115" x2="900" y2="190" stroke="#82b366" stroke-width="1.8" />

  <!-- Visitante -> CU01, CU02, CU03 -->
  <line x1="110" y1="260" x2="260" y2="180" stroke="#6c8ebf" stroke-width="1.8" />
  <line x1="110" y1="275" x2="260" y2="270" stroke="#6c8ebf" stroke-width="1.8" />
  <line x1="110" y1="290" x2="260" y2="360" stroke="#6c8ebf" stroke-width="1.8" />

  <!-- Cajero -> CU07 -->
  <line x1="1010" y1="535" x2="900" y2="500" stroke="#d79b00" stroke-width="1.8" />

  <!-- ==================== RELACIONES INCLUDE (Discontinua Base -> Destino) ==================== -->
  
  <!-- CU03 -> CU04 <<include>> -->
  <line x1="440" y1="365" x2="500" y2="385" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-include)" />
  <rect x="445" y="375" width="55" height="15" fill="#ffffff" rx="2" ry="2"/>
  <text x="472" y="386" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">«include»</text>

  <!-- CU07 -> CU08 <<include>> -->
  <line x1="720" y1="520" x2="620" y2="565" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-include)" />
  <rect x="645" y="535" width="55" height="15" fill="#ffffff" rx="2" ry="2"/>
  <text x="672" y="546" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">«include»</text>

  <!-- ==================== RELACIONES EXTEND (Discontinua Extensor -> Base) ==================== -->

  <!-- CU06 -> CU05 <<extend>> -->
  <line x1="810" y1="270" x2="810" y2="220" stroke="#82b366" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-extend)" />
  <rect x="755" y="238" width="110" height="22" fill="#ffffff" stroke="#82b366" stroke-width="0.8" rx="3" ry="3"/>
  <text x="810" y="248" text-anchor="middle" font-size="9" font-weight="bold" fill="#274e13">«extend»</text>
  <text x="810" y="258" text-anchor="middle" font-size="8" fill="#333333">[Oferta relámpago]</text>

  <!-- CU09 -> CU07 <<extend>> -->
  <line x1="810" y1="590" x2="810" y2="530" stroke="#82b366" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-extend)" />
  <rect x="750" y="552" width="120" height="22" fill="#ffffff" stroke="#82b366" stroke-width="0.8" rx="3" ry="3"/>
  <text x="810" y="562" text-anchor="middle" font-size="9" font-weight="bold" fill="#274e13">«extend»</text>
  <text x="810" y="572" text-anchor="middle" font-size="8" fill="#333333">[Falla lectura cámara]</text>

</svg>