  <rect x="6" y="662" width="76" height="18" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="0.6"/>
  <text x="44" y="675" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">valida y firma</text>
