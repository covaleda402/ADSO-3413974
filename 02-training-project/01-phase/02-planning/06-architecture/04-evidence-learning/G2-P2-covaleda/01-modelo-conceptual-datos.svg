  <rect x="205" y="662" width="130" height="18" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="0.6"/>
  <text x="270" y="675" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">registra redención en</text>
  <text x="278" y="612" fill="#dc2626" font-size="10" font-weight="bold">1..1</text>
  <text x="278" y="742" fill="#dc2626" font-size="10" font-weight="bold">0..1</text>

  <!-- Usuario valida y firma BitacoraCanje (corredor exterior izquierdo) -->
