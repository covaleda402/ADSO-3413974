  <text x="790" y="521" fill="#15803d" font-size="10" font-weight="bold">1..1</text>
  <text x="405" y="521" fill="#15803d" font-size="10" font-weight="bold">0..*</text>

  <!-- Cupon registra redencion en BitacoraCanje (1:1) -->
