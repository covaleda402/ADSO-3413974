  <text x="118" y="816" fill="#dc2626" font-size="10" font-weight="bold">0..*</text>

  <!-- ENTIDAD 1: Usuario -->
  <g id="ent_usuario" transform="translate(60, 110)" filter="url(#sh)">
    <rect x="0" y="0" width="275" height="28" rx="6" fill="#0f172a"/>
