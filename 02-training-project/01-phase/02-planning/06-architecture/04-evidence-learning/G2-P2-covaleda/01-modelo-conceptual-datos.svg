  <text x="1068" y="504" fill="#b45309" font-size="10" font-weight="bold">1..1</text>
  <text x="1196" y="504" fill="#b45309" font-size="10" font-weight="bold">1..*</text>

  <!-- Usuario solicita / adquiere Promocion (N:M) -->
  <path d="M 275 275 L 275 340 L 585 340 L 585 460 L 815 460" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="370" y="330" width="142" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.6"/>
  <text x="441" y="343" text-anchor="middle" fill="#15803d" font-size="10" font-weight="bold">solicita / adquiere (N:M)</text>
  <text x="283" y="292" fill="#15803d" font-size="10" font-weight="bold">0..*</text>
  <text x="790" y="451" fill="#15803d" font-size="10" font-weight="bold">0..*</text>

  <!-- Usuario adquiere y porta Cupon (1:N) -->
  <path d="M 160 275 L 160 365 L 270 365 L 270 435" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="172" y="356" width="94" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.6"/>
  <text x="219" y="369" text-anchor="middle" fill="#15803d" font-size="10" font-weight="bold">adquiere y porta</text>
  <text x="168" y="292" fill="#15803d" font-size="10" font-weight="bold">1..1</text>
  <text x="278" y="425" fill="#15803d" font-size="10" font-weight="bold">0..*</text>

  <!-- Promocion emite Cupon (1:N) -->
  <line x1="815" y1="530" x2="395" y2="530" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="580" y="520" width="52" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.6"/>
