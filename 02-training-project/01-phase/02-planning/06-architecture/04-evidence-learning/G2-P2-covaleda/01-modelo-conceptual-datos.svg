  <!-- NOTA RESUMEN -->
  <g transform="translate(620, 745)" filter="url(#sh)">
    <rect x="0" y="0" width="845" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="26" fill="#0f172a" font-size="12" font-weight="bold">Resumen de Reglas Conceptuales (Rúbrica G2-P2 · Artefacto B1):</text>
    <line x1="18" y1="35" x2="827" y2="35" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="56" fill="#334155" font-size="11">• 8 Entidades Puras de Negocio: Identificadores conceptuales sin claves foráneas físicas ni tipos SQL de implementación.</text>
    <text x="18" y="77" fill="#334155" font-size="11">• Relaciones N:M Explícitas: Usuario (0..*) solicita (0..*) Promocion (materializada en Cupon) y Promocion (0..*) aplica a (1..*) MenuProducto.</text>
    <text x="18" y="98" fill="#334155" font-size="11">• Atributo Multivaluado: Usuario.preferencias_gastronomicas [*] se transforma en tabla independiente en el modelo lógico.</text>
    <text x="18" y="119" fill="#334155" font-size="11">• Dependencia Existencial: FranjaHoraria depende en existencia de Promocion (1..1 a 1..*).</text>
    <text x="18" y="140" fill="#334155" font-size="11">• Auditoría 1:1: Cada Cupon redimido asienta exactamente un registro en BitacoraCanje (1..1 a 0..1).</text>
  </g>
</svg>
