  <!-- ENTIDAD 8: BitacoraCanje -->
  <g id="ent_bitacora" transform="translate(145, 750)" filter="url(#sh)">
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#dc2626"/>
    <rect x="0" y="28" width="250" height="122" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
