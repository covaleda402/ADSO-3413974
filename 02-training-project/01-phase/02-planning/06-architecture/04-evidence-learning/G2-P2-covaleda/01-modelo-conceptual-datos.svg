<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 950" width="1560" height="950" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ENCABEZADO -->
  <rect x="35" y="18" width="1490" height="62" rx="8" fill="#0f172a"/>
  <text x="58" y="45" fill="#ffffff" font-size="16" font-weight="bold">NUVORA · MODELO CONCEPTUAL DE DATOS (ARTEFACTO B1)</text>
  <text x="58" y="67" fill="#94a3b8" font-size="11.5">Centro Comercial San Pedro Plaza · 8 Entidades Puras, Cardinalidades Mín/Máx, Atributo Multivaluado y Relaciones N:M · Rúbrica G2-P2 C1 · Autor: covaleda402</text>

  <!-- CONECTORES (dibujados antes que tarjetas) -->
  <!-- Usuario administra Comercio -->
  <path d="M 198 112 L 198 96 L 940 96 L 940 135" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="505" y="86" width="128" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="569" y="99" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">administra / opera</text>
  <text x="208" y="106" fill="#475569" font-size="10" font-weight="bold">1..*</text>
  <text x="948" y="128" fill="#475569" font-size="10" font-weight="bold">1..1</text>

  <!-- Categoria clasifica Comercio -->
  <line x1="690" y1="202" x2="815" y2="202" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="724" y="192" width="58" height="18" rx="3" fill="#ffffff" stroke="#a5f3fc" stroke-width="0.6"/>
  <text x="753" y="205" text-anchor="middle" fill="#0e7490" font-size="10" font-weight="bold">clasifica</text>
  <text x="696" y="193" fill="#0e7490" font-size="10" font-weight="bold">1..1</text>
  <text x="795" y="193" fill="#0e7490" font-size="10" font-weight="bold">0..*</text>

  <!-- Comercio ofrece MenuProducto -->
  <line x1="1060" y1="202" x2="1220" y2="202" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="1096" y="192" width="88" height="18" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="0.6"/>
  <text x="1140" y="205" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">ofrece en carta</text>
  <text x="1068" y="193" fill="#0369a1" font-size="10" font-weight="bold">1..1</text>
  <text x="1196" y="193" fill="#0369a1" font-size="10" font-weight="bold">1..*</text>

  <!-- Comercio publica Promocion -->
  <line x1="940" y1="270" x2="940" y2="420" stroke="#475569" stroke-width="1.5"/>
  <rect x="912" y="335" width="56" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="940" y="348" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">publica</text>
  <text x="948" y="286" fill="#475569" font-size="10" font-weight="bold">1..1</text>
  <text x="948" y="410" fill="#475569" font-size="10" font-weight="bold">0..*</text>

  <!-- Promocion aplica a MenuProducto (N:M) -->
  <path d="M 1030 420 L 1030 345 L 1310 345 L 1310 285" fill="none" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="1120" y="335" width="96" height="18" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="0.6"/>
  <text x="1168" y="348" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">aplica a (N:M)</text>
  <text x="1038" y="410" fill="#0369a1" font-size="10" font-weight="bold">0..*</text>
  <text x="1318" y="302" fill="#0369a1" font-size="10" font-weight="bold">1..*</text>

