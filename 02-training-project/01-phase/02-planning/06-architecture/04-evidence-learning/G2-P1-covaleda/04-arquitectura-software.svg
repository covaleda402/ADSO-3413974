<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow_blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB" />
    </marker>
    <marker id="arrow_purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333EA" />
    </marker>
    <marker id="arrow_red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626" />
    </marker>
    <marker id="dip_arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#DC2626" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="50" y="20" width="1200" height="46" rx="6" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="650" y="42" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">NUVORA — ARQUITECTURA DEL SOFTWARE EN CAPAS ESTRICTAS (CLEAN ARCHITECTURE)</text>
  <text x="650" y="58" fill="#DBEAFE" font-size="11" text-anchor="middle">Guía 2 · Producto 1 (G2-P1) · RAP 593103 (Criterio C4) · Autor: Jose Esneider Covaleda (covaleda402) · Sin Saltos de Capa</text>

  <!-- Capa 1: Presentación -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="1180" height="150" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect width="1180" height="28" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="590" y="19" fill="#1E40AF" font-size="12" font-weight="bold" text-anchor="middle">1. CAPA DE PRESENTACIÓN / CLIENTE (UI &amp; API GATEWAY)</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="125" y="28" fill="#1E3A8A" font-size="12" font-weight="bold" text-anchor="middle">PWA Visitante (Mobile)</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Catálogo, Billetera QR</text>
      <text x="125" y="64" fill="#2563EB" font-size="9" text-anchor="middle">Timer Regresivo 2h</text>
    </g>
    <g transform="translate(320, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="125" y="28" fill="#1E3A8A" font-size="12" font-weight="bold" text-anchor="middle">Terminal POS Web Caja</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Escáner Óptico / Teclado</text>
      <text x="125" y="64" fill="#2563EB" font-size="9" text-anchor="middle">Contingencia Manual 8 Car</text>
    </g>
    <g transform="translate(610, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="125" y="28" fill="#1E3A8A" font-size="12" font-weight="bold" text-anchor="middle">Panel Web Administrador</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Métricas Comerciales</text>
      <text x="125" y="64" fill="#2563EB" font-size="9" text-anchor="middle">Auditoría Transaccional</text>
    </g>
    <g transform="translate(900, 48)">
      <rect width="250" height="80" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
      <text x="125" y="28" fill="#1E40AF" font-size="12" font-weight="bold" text-anchor="middle">Controladores REST / Guard</text>
      <text x="125" y="48" fill="#1E3A8A" font-size="10" text-anchor="middle">ValidationPipes (DTO)</text>
      <text x="125" y="64" fill="#1D4ED8" font-size="9" font-weight="bold" text-anchor="middle">RoleGuard RBAC (JWT)</text>
    </g>
  </g>

  <!-- Flow Arrow Pres -> App -->
  <path d="M 650 240 L 650 280" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow_blue)"/>
  <text x="660" y="265" fill="#2563EB" font-size="10" font-weight="bold">Invocación HTTP REST (Payload JSON / DTO)</text>

  <!-- Capa 2: Aplicación -->
  <g transform="translate(60, 290)" filter="url(#shadow)">
    <rect width="1180" height="150" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
    <rect width="1180" height="28" rx="6" fill="#F3E8FF" stroke="#9333EA" stroke-width="1"/>
    <text x="590" y="19" fill="#6B21A8" font-size="12" font-weight="bold" text-anchor="middle">2. CAPA DE APLICACIÓN Y CASOS DE USO (ORQUESTACIÓN Y FACHADAS)</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="80" rx="4" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.8"/>
      <text x="125" y="28" fill="#581C87" font-size="12" font-weight="bold" text-anchor="middle">CanjeCuponFacade</text>
      <text x="125" y="48" fill="#6B21A8" font-size="10" text-anchor="middle">Patrón Facade (Orquestador)</text>
      <text x="125" y="64" fill="#7E22CE" font-size="9" font-weight="bold" text-anchor="middle">Canje Atómico en Caja</text>
    </g>
    <g transform="translate(320, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
      <text x="125" y="28" fill="#581C87" font-size="12" font-weight="bold" text-anchor="middle">EmisionCuponUseCase</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Control Cupo Diario (RN-01)</text>
      <text x="125" y="64" fill="#7E22CE" font-size="9" text-anchor="middle">Firma Criptográfica HMAC</text>
    </g>
    <g transform="translate(610, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
      <text x="125" y="28" fill="#581C87" font-size="12" font-weight="bold" text-anchor="middle">CatalogoPresupuestoUseCase</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Algoritmo Combinatoria Menú</text>
      <text x="125" y="64" fill="#7E22CE" font-size="9" text-anchor="middle">Filtro por Rango en COP</text>
    </g>
    <g transform="translate(900, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
      <text x="125" y="28" fill="#581C87" font-size="12" font-weight="bold" text-anchor="middle">AuditoriaService</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Pistas Inmutables con Hash</text>
      <text x="125" y="64" fill="#7E22CE" font-size="9" text-anchor="middle">Métricas de Conversión</text>
    </g>
  </g>

  <!-- Flow Arrow App -> Dom -->
  <path d="M 650 440 L 650 480" fill="none" stroke="#9333EA" stroke-width="2.5" marker-end="url(#arrow_purple)"/>
  <text x="660" y="465" fill="#9333EA" font-size="10" font-weight="bold">Lógica de Dominio y Contratos</text>

  <!-- Capa 3: Dominio -->
  <g transform="translate(60, 490)" filter="url(#shadow)">
    <rect width="1180" height="150" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <rect width="1180" height="28" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <text x="590" y="19" fill="#14532D" font-size="12" font-weight="bold" text-anchor="middle">3. CAPA DE DOMINIO (ENTIDADES DE NEGOCIO PURAS Y CONTRATOS)</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="80" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
      <text x="125" y="28" fill="#14532D" font-size="12" font-weight="bold" text-anchor="middle">Entidad Cupon</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Reglas de Expiración (2h)</text>
      <text x="125" y="64" fill="#15803D" font-size="9" text-anchor="middle">Ciclo de Vida de Canje</text>
    </g>
    <g transform="translate(320, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
      <text x="125" y="28" fill="#14532D" font-size="12" font-weight="bold" text-anchor="middle">Entidad Promocion &amp; Franja</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Control de Stock e Inventario</text>
      <text x="125" y="64" fill="#15803D" font-size="9" text-anchor="middle">Validación Horaria Local</text>
    </g>
    <g transform="translate(610, 48)">
      <rect width="250" height="80" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
      <text x="125" y="28" fill="#78350F" font-size="12" font-weight="bold" text-anchor="middle">IEstrategiaDescuento</text>
      <text x="125" y="48" fill="#92400E" font-size="10" text-anchor="middle">Patrón Strategy (Polimórfico)</text>
      <text x="125" y="64" fill="#B45309" font-size="9" font-weight="bold" text-anchor="middle">Porcentual / Fijo / Volumen</text>
    </g>
    <g transform="translate(900, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
      <text x="125" y="28" fill="#14532D" font-size="12" font-weight="bold" text-anchor="middle">Contratos IRepository</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Inversión de Dependencias (DIP)</text>
      <text x="125" y="64" fill="#15803D" font-size="9" text-anchor="middle">ICuponRepo, IComercioRepo</text>
    </g>
  </g>

  <!-- Flow Arrow Infra -> Dom (DIP) -->
  <path d="M 950 690 L 950 650" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#dip_arrow)"/>
  <text x="960" y="675" fill="#DC2626" font-size="10" font-weight="bold">Implementación de Repositorios (Inversión DIP)</text>

  <!-- Capa 4: Infraestructura -->
  <g transform="translate(60, 690)" filter="url(#shadow)">
    <rect width="1180" height="150" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect width="1180" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="590" y="19" fill="#991B1B" font-size="12" font-weight="bold" text-anchor="middle">4. CAPA DE INFRAESTRUCTURA Y PERSISTENCIA (DATOS Y SERVICIOS EXTERNOS)</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="125" y="28" fill="#991B1B" font-size="12" font-weight="bold" text-anchor="middle">Adaptador Criptográfico</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">HMAC-SHA256 Token QR</text>
      <text x="125" y="64" fill="#DC2626" font-size="9" text-anchor="middle">Bcrypt Salted Hashing</text>
    </g>
    <g transform="translate(320, 48)">
      <rect width="250" height="80" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
      <text x="125" y="28" fill="#7F1D1D" font-size="12" font-weight="bold" text-anchor="middle">Redis 7.0 In-Memory Cache</text>
      <text x="125" y="48" fill="#991B1B" font-size="10" text-anchor="middle">Catálogo y Franjas Rápidas</text>
      <text x="125" y="64" fill="#B91C1C" font-size="9" font-weight="bold" text-anchor="middle">RNF-01: Latencia &lt; 5 ms</text>
    </g>
    <g transform="translate(610, 48)">
      <rect width="250" height="80" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
      <text x="125" y="28" fill="#7F1D1D" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL 15+ Enterprise</text>
      <text x="125" y="48" fill="#991B1B" font-size="10" text-anchor="middle">SELECT ... FOR UPDATE (ACID)</text>
      <text x="125" y="64" fill="#B91C1C" font-size="9" font-weight="bold" text-anchor="middle">RNF-03: Row-Locking Atómico</text>
    </g>
    <g transform="translate(900, 48)">
      <rect width="250" height="80" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="125" y="28" fill="#991B1B" font-size="12" font-weight="bold" text-anchor="middle">TypeORM Data Mapper</text>
      <text x="125" y="48" fill="#4B5563" font-size="10" text-anchor="middle">Transacciones y Pool de Conexiones</text>
      <text x="125" y="64" fill="#DC2626" font-size="9" text-anchor="middle">Mapeo Lógico Relacional 3FN</text>
    </g>
  </g>

</svg>
